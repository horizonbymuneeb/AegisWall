name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate
        shell: powershell
        run: .\tools\validate.ps1

      - name: Build and test
        shell: powershell
        run: .\build.ps1 -Test

      - name: Build MSI installers
        shell: powershell
        run: .\build-msi.ps1 -SkipBuild

      - name: Package portable ZIP
        shell: powershell
        run: |
          $stage = Join-Path $env:TEMP 'AegisWall-release'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path .\build\* -Destination $stage -Recurse -Force
          Copy-Item -Path .\src -Destination $stage -Recurse -Force
          Copy-Item -Path .\docs -Destination $stage -Recurse -Force
          Copy-Item -Path .\assets -Destination $stage -Recurse -Force
          foreach ($file in @('install.ps1','uninstall.ps1','Run-AegisWall.ps1','Run-AegisWall-Cli.ps1','Run-AegisWall-Service.ps1','AegisWall-Portable.bat','README.md','LICENSE')) {
            Copy-Item -Path (Join-Path $PWD $file) -Destination $stage -Force
          }
          $zip = Join-Path $PWD 'dist\AegisWall-0.1.1.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force

      - name: Checksums
        shell: powershell
        run: |
          Get-ChildItem .\dist\*.msi, .\dist\*.zip |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } |
            Set-Content .\dist\SHA256SUMS.txt -Encoding ASCII

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
